services:
  redis:
    image: redis:7-alpine
    container_name: growth_engine_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: growth_engine_api
    restart: always
    ports:
      - "${PORT:-5005}:${PORT:-5005}"
    env_file: .env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - PORT=${PORT:-5005}
    depends_on:
      - redis
    command: npm start
    volumes:
      - ./backend/wa-session:/usr/src/app/wa-session

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: growth_engine_worker
    restart: always
    env_file: .env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
    depends_on:
      - redis
    command: npm run worker
    volumes:
      - ./backend/wa-session:/usr/src/app/wa-session

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: growth_engine_scheduler
    restart: always
    env_file: .env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
    depends_on:
      - redis
    command: npm run scheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: growth_engine_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api
